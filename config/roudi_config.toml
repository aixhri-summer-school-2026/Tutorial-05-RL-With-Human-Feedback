# Iceoryx RouDi shared-memory config for the MILE container.
# Mempools sized for CycloneDDS discovery + user data messages.
# Images DO go through this shm transport (contrary to an earlier assumption here that
# variable-length types fall back to UDP) — a 1920x1080 RGB8 frame is ~6.2MB and needs a
# chunk from the largest (8388608-byte) pool below. RELIABLE + KEEP_LAST(100) on usb_cam's
# image_raw publisher means a slow subscriber (e.g. a Python ChArUco/PnP detector running
# behind realtime) can pin many in-flight 6MB+ chunks at once; with only 2-3 concurrent
# subscribers (apriltag_node, calibrate_camera.py, ...) that exhausts a small pool fast and
# aborts usb_cam_node_exe (MEPOO__MEMPOOL_GETCHUNK_POOL_IS_RUNNING_OUT_OF_CHUNKS). Sized
# generously below for that reason, not because steady-state usage needs this many.
[general]
version = 1

[[segment]]

[[segment.mempool]]
size = 128
count = 10000

[[segment.mempool]]
size = 1024
count = 5000

[[segment.mempool]]
size = 16384
count = 1000

[[segment.mempool]]
size = 131072
count = 200

[[segment.mempool]]
size = 524288
count = 50

[[segment.mempool]]
size = 1048576
count = 30

[[segment.mempool]]
size = 8388608
count = 40
