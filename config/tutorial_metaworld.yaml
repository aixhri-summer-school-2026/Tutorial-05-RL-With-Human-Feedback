# Tutorial Tier 1 — MetaWorld synthetic loop (make tutorial-metaworld)
# Tests the participant's MILE loss implementation; runs in ~5 min.
# Scaled-down version of metaworld.yaml: 2 rounds, 50 epochs, smaller batch.

train:
  num_epochs: 50
  batch_size: 1024
  lr: 0.0001
  lambda1: 1.0
  lambda2: 1.0

experiment:
  name: tutorial_metaworld
  mode: iterative
  env_name: peg-insert-side-v2

  collector: synthetic
  policy_type: sac
  policy_path: ../trained_models/initial_policy
  mental_model_type: bc
  gt_mental_model_path: ../trained_models/gt_mental_model
  intervention_policy_path: ../trained_models/expert_policy
  use_warm_start: true
  warm_start_path: ../trained_models/warm_started_mental_model

  num_rounds: 2
  episodes_per_round: 1
  include_offline_dataset: false

  validate:
    enabled: false
    every_n_epochs: 100
  logging:
    terminal_output_to_txt: false
    log_tb: false
    log_wandb: false
  save:
    enabled: true
    every_n_epochs: 0
    on_best_validation: false
    on_best_rollout_return: false
    on_best_rollout_success_rate: true
    outdir: ../output_dir
  rollout:
    enabled: true
    auto_eval: true
    n_episodes: 10
    every_n_epochs: 50
