# Franka block-stacking — MuJoCo sim, dev (make mile)
# Human-in-the-loop via Xbox gamepad; auto_eval disabled so the policy never
# drives the sim autonomously during data collection.

train:
  num_epochs: 500        # more epochs than real because sim resets are free
  batch_size: 128
  lr: 0.00001
  lambda1: 1.0           # weight on intervention BCE term
  lambda2: 1.0           # weight on human-action NLL term (intervention steps only)

experiment:
  name: mile-franka
  mode: iterative
  env_name: Franka-Stack-Sim-v0

  collector: real
  intervener: joystick
  joystick_translation_scale: 0.5

  intervention_cost: 2.0       # probit model cost (see COST_LOOKUP in computational_model.py)
  intervention_cdf_scale: 2.0

  num_rounds: 5
  episodes_per_round: 3
  include_offline_dataset: false

  policy_type: bc
  policy_path: ../trained_models/franka/base_policy
  mental_model_type: bc
  use_warm_start: true
  warm_start_path: ../trained_models/franka/base_policy

  validate:
    enabled: false
    every_n_epochs: 100
  logging:
    terminal_output_to_txt: false
    log_tb: false
    log_wandb: false
  save:
    enabled: true
    every_n_epochs: 0
    on_best_validation: false
    on_best_rollout_return: false
    on_best_rollout_success_rate: false
    outdir: ../output_dir/franka
  rollout:
    enabled: false       # never run policy autonomously
    auto_eval: false
    n_episodes: 5
    every_n_epochs: 100
