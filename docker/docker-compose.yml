# One persistent MILE-on-multipanda service. `network_mode: host` shares the DDS graph with
# the sim; an internal Xvfb (:99) provides the headless display. Device/GPU passthroughs are
# declared but commented so France-day (SpaceMouse/camera/GPU) is config-only, not a rebuild.
services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mile:franka-humble
    container_name: mile_sim
    init: true                             # reap killed mujoco_node children on sim re-launch;
                                           # without an init, PID 1 (sleep infinity) leaves zombies
                                           # and their stale DDS participants linger on the graph.
    network_mode: host
    working_dir: /home/user/mile-code
    environment:
      - DISPLAY=:99                        # internal Xvfb (headless default). sim-gui overrides
                                           # per-exec with the host display (docker exec -e DISPLAY).
                                           # Must NOT be ${DISPLAY:-:99}: an SSH-forwarded/host
                                           # DISPLAY leaks in and mujoco_ros GLFW init fails.
      - LIBGL_ALWAYS_SOFTWARE=1            # overridden per-exec by sim-gui for HW GL
      - GALLIUM_DRIVER=llvmpipe
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ..:/home/user/mile-code            # live host edits in dev
      - /tmp/.X11-unix:/tmp/.X11-unix      # host X socket for sim-gui live window
      - /dev/bus/usb:/dev/bus/usb          # Intel RealSense (serial 217222067236) libusb enumeration
    devices:
      - /dev/hidraw0:/dev/hidraw0          # SpaceMouse (3Dconnexion) — verify node with: lsusb | grep -i 3dconnex; ls -l /dev/hidraw*
      # Gamepad nodes — comment out if the controller is unplugged (compose hard-requires every
      # listed device, so an absent node blocks container start). Verify: ls -l /dev/input/js*
      - /dev/input/js0:/dev/input/js0          # gamepad (Xbox 360 pad)
      - /dev/input/event20:/dev/input/event20  # Xbox 360 controller SDL evdev node
      # Intel RealSense D415 UVC video nodes (third-person eye-to-hand camera).
      # The sparse set is normal — the D415 exposes color, depth, and IR metadata
      # nodes; exact minor numbers depend on udev enumeration order and change after
      # USB reset / replug. video0/video1 are a ZED 2i (unrelated); skip those.
      # device_cgroup_rules 'c 81:* rmw' gives the container access to any new minor
      # without a restart, but listed devices must exist at compose-up time.
      - /dev/video2:/dev/video2
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/video6:/dev/video6
      - /dev/video7:/dev/video7
      - /dev/video9:/dev/video9
    device_cgroup_rules:
      - 'c 81:* rmw'                       # video4linux (RealSense UVC) — survives replug to new minors
      - 'c 189:* rmw'                      # usb (RealSense libusb)
    gpus: all                              # NVIDIA hardware GL + faster torch
    command: sleep infinity
