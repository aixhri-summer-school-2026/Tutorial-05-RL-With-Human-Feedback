# One persistent MILE-on-multipanda service. `network_mode: host` shares the DDS graph with
# the sim; an internal Xvfb (:99) provides the headless display. GPU passthrough (`gpus: all`)
# is on by default for HW GL + faster torch (comment it out on Mac ARM / no NVIDIA GPU). The
# RT CPU pinning (`cpuset`) stays commented — France-day only, config-only, not a rebuild.
services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mile:franka-humble
    container_name: mile_sim
    init: true                             # reap killed mujoco_node children on sim re-launch;
                                           # without an init, PID 1 (sleep infinity) leaves zombies
                                           # and their stale DDS participants linger on the graph.
    network_mode: host
    # Keep off CPUs 0–3 which are reserved for the franka_ros2 RT control loop.
    # cpuset: "0-15"
    working_dir: /home/user/mile-code
    environment:
      - DISPLAY=:99                        # internal Xvfb (headless default). sim-gui overrides
                                           # per-exec with the host display (docker exec -e DISPLAY).
                                           # Must NOT be ${DISPLAY:-:99}: an SSH-forwarded/host
                                           # DISPLAY leaks in and mujoco_ros GLFW init fails.
      - LIBGL_ALWAYS_SOFTWARE=1            # overridden per-exec by sim-gui for HW GL
      - GALLIUM_DRIVER=llvmpipe
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///home/user/mile-code/config/cyclonedds.xml
      - ROS_DOMAIN_ID=39                    # must match realtime_franka_humble's domain (~/git/multipanda_ros2/docker-compose.yml) so this container can see the real controller's nodes/topics/services over the DDS graph
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ..:/home/user/mile-code            # live host edits in dev
      - /tmp/.X11-unix:/tmp/.X11-unix      # host X socket for sim-gui live window
      - /dev:/dev                          # all host devices (D415, gamepad, SpaceMouse, etc.) — survives USB replug
    device_cgroup_rules:
      - 'c 13:* rmw'                       # input (gamepad, SpaceMouse, etc.)
      - 'c 81:* rmw'                       # video4linux (RealSense UVC)
      - 'c 189:* rmw'                      # usb (RealSense libusb)
    gpus: all                              # NVIDIA hardware GL + faster torch
                                           # (Mac ARM / no NVIDIA GPU: comment this line out — training falls back to CPU)
    # Start Xvfb on :99 at container boot so ffmpeg x11grab has a local X server to record
    # (SSH-forwarded / remote DISPLAY values are unreachable by x11grab).  sim-gui overrides
    # DISPLAY per-exec with the host display for live viewing; the headless sim renders to :99.
    # The MuJoCo GLFW window renders at ~2/3 of the Xvfb resolution; the rollout scripts
    # auto-crop the black borders via ffmpeg cropdetect.  Keep the Xvfb large enough that the
    # window is at a legible pixel count.
    command: >
      bash -c 'Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp +extension GLX +render & \
        LD_LIBRARY_PATH=/opt/ros/humble/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH \
        /opt/ros/humble/bin/iox-roudi -c /home/user/mile-code/config/roudi_config.toml & \
        sleep infinity'
