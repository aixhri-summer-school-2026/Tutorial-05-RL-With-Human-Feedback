mujoco_server:
  ros__parameters:
    MujocoPlugins:
      names:
        - mujoco_ros2_control
      mujoco_ros2_control:
        type: mujoco_ros2_control::MujocoRos2ControlPlugin
        hardware:
          type: mujoco_ros_control/RobotHW
          control_period: 0.001
        params:
          namespace: ""
          robot_description_node: "robot_state_publisher"
          robot_description: "robot_description"

controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    joint_impedance_example_controller:
      type: franka_example_controllers/JointImpedanceExampleController
    cartesian_impedance_example_controller:
      type: franka_example_controllers/CartesianImpedanceExampleController
    custom_cartesian_impedance_controller:
      type: franka_example_controllers/CustomCartesianImpedanceController
    move_to_start_example_controller:
      type: franka_example_controllers/MoveToStartExampleController

joint_state_broadcaster:
  ros__parameters:
    frame_id: panda_link0
    use_local_topics: true

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda
    frequency: 60

franka_robot_model_broadcaster:
  ros__parameters:
    arm_id: panda
    frequency: 60

joint_impedance_example_controller:
  ros__parameters:
    arm_id: panda
    k_gains: [24.0, 24.0, 24.0, 24.0, 10.0, 6.0, 2.0]
    d_gains: [2.0, 2.0, 2.0, 1.0, 1.0, 1.0, 0.5]

cartesian_impedance_example_controller:
  ros__parameters:
    arm_id: panda

custom_cartesian_impedance_controller:
  ros__parameters:
    arm_id: panda
    pub_frequency: 40.0
    pos_stiff: 4000.0
    translational_clip: 0.5
    translational_Ki: 0.0
    rot_stiff: 800.0
    rotational_Ki: 0.0
    ns_stiff_q1_to_4: 0.0
    ns_stiff_q5_to_7: 0.0

move_to_start_example_controller:
  ros__parameters:
    arm_id: panda
    k_gains: [500.0, 500.0, 500.0, 500.0, 200.0, 150.0, 50.0]
    d_gains: [50.0, 50.0, 50.0, 50.0, 20.0, 15.0, 10.0]
